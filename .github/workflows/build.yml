name: Build Forge mod

on:
  push:
    paths-ignore:
      - 'artifacts/**'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build
        shell: bash
        run: |
          set +e
          ./gradlew build --stacktrace 2>&1 | tee gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Последние строки публикуются как annotation и остаются доступны через GitHub API.
            details=$(tail -n 120 gradle-build.log | sed 's/%/%25/g; s/\r/%0D/g; s/$/%0A/' | tr -d '\n')
            echo "::error title=Gradle build failed::$details"
          fi
          exit "$status"

      - name: Verify HUD and synchronization in JAR
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name 'decaying_code-*.jar' -print -quit)
          test -n "$jar_file"
          entries=$(jar tf "$jar_file")
          grep -Fx 'assets/decaying_code/textures/gui/eye.png' <<< "$entries"
          grep -Fx 'com/decayingcode/client/gui/SanityHudOverlay.class' <<< "$entries"
          grep -Fx 'com/decayingcode/sanity/network/SanitySyncS2CPacket.class' <<< "$entries"

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: decaying-code-1.20.1
          path: build/libs/decaying_code-*.jar
          if-no-files-found: error

      - name: Add installable JAR to the branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          jar_file=$(find build/libs -maxdepth 1 -name 'decaying_code-*.jar' -print -quit)
          mkdir -p artifacts
          rm -f artifacts/decaying_code-*.jar
          cp "$jar_file" artifacts/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artifacts/
          if ! git diff --cached --quiet; then
            git commit -m "Add compiled Decaying Code JAR [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
